[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callbench"
version = "0.1.0"
description = "Synthetic-caller evaluation harness for voice AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noella John" }]
dependencies = ["pyyaml>=6.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
twilio = ["twilio>=9.0"]

[project.scripts]
callbench = "callbench.cli:main"

[tool.setuptools.packages.find]
include = ["callbench*"]

[tool.setuptools.package-data]
callbench = ["web/static/*"]
