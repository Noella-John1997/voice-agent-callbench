name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Regression gate: fail the build if the demo agent's pass rate drops below 50%
      - run: callbench run scenarios/employment_verification.yaml --out reports --fail-under 0.5
